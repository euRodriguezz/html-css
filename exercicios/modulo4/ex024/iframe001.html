<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        
        <!--TAMANHO PADRãO: 300px x 150px-->

        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500px" scolling="no">
                <a href="https://cursoemvideo.com" target="_blank" rel="external"> Cursoemvideo</a>
        </iframe>
        
        
        para aprender a programar</p>
        <p>O site do <iframe src="https://www.google.com/" frameborder="0"></iframe> tambem é muito legal, pena que não funciona dentro do iframe.</p> <!-- existem sites que possuem a proteção contra iframe-->
    

        O repositório do Guanabara 
        <iframe src="https://Gustavoguanabara.github.io" frameborder="0" height="500px" width="500px">
            <a href="https://gustavoguanabara.github.io" target="_blank">GitHub</a>
        </iframe>
        também é bem legal
</body>
</html>
